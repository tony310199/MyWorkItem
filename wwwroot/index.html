<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Item List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container-fluid px-3 px-lg-4">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-check2-square me-2"></i>Work Item List</a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="text-white-50 small d-none d-sm-inline" for="userSelect">目前身分</label>
        <select id="userSelect" class="form-select form-select-sm identity-select" aria-label="切換身分">
          <option value="">載入中...</option>
        </select>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-lg-4 py-4">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
      <div>
        <p class="text-primary fw-semibold mb-1">WORK ITEM APPLICATION</p>
        <h1 class="h3 mb-0" id="pageTitle">前台工作清單</h1>
      </div>
      <span id="roleBadge" class="badge rounded-pill role-badge">一般使用者</span>
    </div>

    <div id="loadingView" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">載入中</span></div>
    </div>

    <section id="userView" class="d-none">
      <div class="card app-card">
        <div class="card-header app-card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
          <div>
            <h2 class="h5 mb-1">我的 Work Items</h2>
            <small id="userStatusText" class="text-secondary">載入個人狀態...</small>
          </div>
          <button id="confirmButton" class="btn btn-primary px-4" type="button">
            <i class="bi bi-cloud-check me-1"></i>Confirm 儲存狀態
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table align-middle mb-0 work-table">
              <thead>
                <tr>
                  <th class="check-column">選擇</th>
                  <th>項目</th>
                  <th>類別</th>
                  <th>優先度</th>
                  <th>到期日</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="userItemsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="adminView" class="d-none">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card app-card h-100">
            <div class="card-header app-card-header">
              <h2 class="h5 mb-0" id="formTitle">新增 Work Item</h2>
            </div>
            <div class="card-body">
              <form id="workItemForm" novalidate>
                <input id="itemId" type="hidden">
                <div class="mb-3">
                  <label class="form-label" for="title">標題 <span class="text-danger">*</span></label>
                  <input id="title" class="form-control" maxlength="200" required>
                  <div class="invalid-feedback">請輸入標題。</div>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="description">詳細資料</label>
                  <textarea id="description" class="form-control" rows="4" maxlength="2000"></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="category">類別</label>
                  <input id="category" class="form-control" maxlength="100" placeholder="例如：面試準備">
                </div>
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label" for="priority">優先度</label>
                    <select id="priority" class="form-select">
                      <option value="0">Low</option>
                      <option value="1" selected>Medium</option>
                      <option value="2">High</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="dueDate">到期日</label>
                    <input id="dueDate" class="form-control" type="date">
                  </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                  <button id="saveButton" class="btn btn-primary flex-grow-1" type="submit"><i class="bi bi-check-lg me-1"></i>儲存</button>
                  <button id="cancelEditButton" class="btn btn-outline-secondary d-none" type="button">取消</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card app-card">
            <div class="card-header app-card-header d-flex justify-content-between align-items-center">
              <h2 class="h5 mb-0">全部 Work Items</h2>
              <button id="refreshAdminButton" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table align-middle mb-0 admin-table">
                  <thead><tr><th>標題</th><th>類別</th><th>優先度</th><th>到期日</th><th class="text-end">操作</th></tr></thead>
                  <tbody id="adminItemsBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="detailTitle">項目詳細資料</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">關閉</button></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title fs-5">確認刪除</h2><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">確定要刪除「<strong id="deleteItemTitle"></strong>」嗎？</div>
        <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">取消</button><button id="confirmDeleteButton" class="btn btn-danger" type="button">刪除</button></div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-dark border-0" role="alert">
      <div class="d-flex"><div class="toast-body" id="toastMessage"></div><button class="btn-close btn-close-white me-2 m-auto" type="button" data-bs-dismiss="toast"></button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
